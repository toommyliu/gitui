name: Desktop packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "24.22.0"
          cache: true
      - run: vp run package:desktop --config.mac.identity=-
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitui-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          compression-level: 0
          path: |
            apps/desktop/dist/package/*.dmg
            apps/desktop/dist/package/*.zip
            apps/desktop/dist/package/*.exe
            apps/desktop/dist/package/*.AppImage
