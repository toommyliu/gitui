<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Git</title>
    <!-- Paints before the stylesheet loads. Keep in sync with --background in src/styles.css and backgroundColor in apps/desktop/src/main.ts. -->
    <style>
      html {
        background: #fbfcfd;
      }
      html.dark {
        background: #141619;
      }
    </style>
    <script>
      {
        const stored = localStorage.getItem("theme")
        const theme =
          stored === "light" || stored === "dark"
            ? stored
            : (window.gitui?.isSystemDark?.() ?? matchMedia("(prefers-color-scheme: dark)").matches)
              ? "dark"
              : "light"
        document.documentElement.classList.add(theme)
        document.documentElement.style.colorScheme = theme
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
