packages:
  - "apps/*"
  - "packages/*"

minimumReleaseAgeExclude:
  - "@ui-sdk/core"
  - "@ui-sdk/solid"

allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true
  msw: false

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vitest: 5.0.3
  vite-plus: 1.1.0

overrides:
  vite: "catalog:"
  vitest: "catalog:"
  "@solidjs/compiler": 2.0.0-rc.14

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

patchedDependencies:
  # Copied from ui-sdk's own repo, which pins this patch and tests its components against it.
  # It changes how delegated events expose `currentTarget`: one shared getter that reads a
  # per-event value, instead of a new getter defined on the event for every handler.
  # Remove it together with the rc.14 pin once ui-sdk supports an unpatched @solidjs/web.
  "@solidjs/web@2.0.0-rc.14": patches/@solidjs__web@2.0.0-rc.14.patch
  # Two fixes for trees with thousands of files: treeFromPaths scanned every sibling before adding
  # a file, and a checkable tree recomputed every item's checked state on each part's read.
  # A third keeps resizable handles from reacting through a dialog or popover rendered inside
  # their group: their document-wide hit test treated anything inside the group's DOM as theirs,
  # including a top-layer backdrop that covers the handle.
  # Drop this once ui-sdk ships all three.
  "@ui-sdk/core@0.1.0-beta.5": patches/@ui-sdk__core@0.1.0-beta.5.patch
